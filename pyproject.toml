[project]
name = "ha-assist-workspace"
version = "0.1.0"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "homeassistant==2026.8.3",
  "hassil>=3.12.0",
  "home-assistant-intents>=2026.8.0",
  "mypy>=1.19.1",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "pytest-homeassistant-custom-component>=0.13.357",
  "ruff>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/", "frontend/"]
